trace-dir: data/traces/nodes=32_prio=4_arrival=2s
result-dir: results/plugin/mode=periodic32s_blocking=0_defpreempt=1_nodes=32_prio=4_arrival=2s
kwokctl-config-file: data/configs-kwokctl/plugin-scheduler-defpreempt=1.yaml
override-kwokctl-envs:
