trace-dir: data/traces/nodes=16_prio=4_arrival=2s
result-dir: results/plugin/mode=periodic64s_blocking=1_defpreempt=1_nodes=16_prio=4_arrival=2s
kwokctl-config-file: data/configs-kwokctl/plugin-scheduler-defpreempt=1.yaml
override-kwokctl-envs:
  - name: SOLVER_PYTHON_TIMEOUT
    value: "16s"
  - name: OPTIMIZE_MODE
    value: "periodic"
  - name: OPTIMIZE_BLOCKING_SOLVING
    value: "true"
  - name: OPTIMIZE_PERIODIC_INTERVAL
    value: "64s"
