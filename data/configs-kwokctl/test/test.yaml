kind: KwokctlConfiguration
apiVersion: config.kwok.x-k8s.io/v1alpha1
options:
  kubeSchedulerConfig: manifests/mypriorityoptimizer/plugin-scheduler-config-defpreempt=0.yaml
  kubeSchedulerBinary: bin/kube-scheduler
  kubeSchedulerImage: localhost:5000/scheduler-plugins/kube-scheduler:dev
  kubeApiserverBinary: bin/kube-apiserver
  kubeControllerManagerBinary: bin/kube-controller-manager
componentsPatches:
  - name: kube-scheduler
    # uncomment for more verbose logging
    # extraArgs:
    #   - key: v
    #     value: "10"
    extraEnvs:
      - name: OPTIMIZE_BLOCKING_SOLVING
        value: "true"
      - name: SOLVER_PYTHON_ENABLED
        value: "true"
      - name: SOLVER_PYTHON_TIMEOUT
        value: 20s
      - name: OPTIMIZE_PERIODIC_INTERVAL
        value: 10s
      - name: OPTIMIZE_STABLE_QUEUE_DELAY
        value: 5s