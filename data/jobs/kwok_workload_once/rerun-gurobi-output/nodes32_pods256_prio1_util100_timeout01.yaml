workload-config-file: data/configs-workload/base.yaml
kwokctl-config-file: data/configs-kwokctl/plugin-scheduler-defpreempt=0.yaml
seed-file: data/jobs/kwok_workload_once/rerun-gurobi-output/nodes32_pods256_prio1_util100_timeout01.txt
output-dir: results/rerun-gurobi-output/{solver}/nodes32_pods256_prio1_util100_timeout01
solver-trigger: true
save-scheduler-logs: true
override-workload-config:
  num_nodes: 32
  num_pods: 256
  num_priorities: 1
  util: 1.0
  settle_timeout_max: 70s
override-kwokctl-envs:
- name: OPTIMIZE_MODE
  value: manual
- name: SOLVER_PYTHON_TIMEOUT
  value: 1s
- name: PLAN_EXECUTION_TIMEOUT
  value: 60s
