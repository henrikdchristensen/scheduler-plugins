workload-config-file: data/configs-workload/base.yaml
kwokctl-config-file: data/configs-kwokctl/plugin-scheduler-defpreempt=0.yaml
seed-file: data/jobs/kwok_workload_once/rerun-gurobi-output/nodes16_pods64_prio2_util105_timeout01.txt
output-dir: results/rerun-gurobi-output/{solver}/nodes16_pods64_prio2_util105_timeout01
solver-trigger: true
save-scheduler-logs: true
override-workload-config:
  num_nodes: 16
  num_pods: 64
  num_priorities: 2
  util: 1.05
  settle_timeout_max: 70s
override-kwokctl-envs:
- name: OPTIMIZE_MODE
  value: manual
- name: SOLVER_PYTHON_TIMEOUT
  value: 1s
- name: PLAN_EXECUTION_TIMEOUT
  value: 60s
