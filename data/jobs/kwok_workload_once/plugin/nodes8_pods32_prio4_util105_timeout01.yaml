workload-config-file: data/configs-workload/base.yaml
kwokctl-config-file: data/configs-kwokctl/plugin-scheduler-defpreempt=0.yaml
seed-file: data/seeds/kwok_workload_once/seeds_100.txt
output-dir: results/plugin/{solver}/nodes8_pods32_prio4_util105_timeout01
solver-trigger: true
save-scheduler-logs: true
override-workload-config:
  num_nodes: 8
  num_pods: 32
  num_priorities: 4
  util: 1.05
  settle_timeout_max: 70s
override-kwokctl-envs:
- name: OPTIMIZE_MODE
  value: manual
- name: SOLVER_PYTHON_TIMEOUT
  value: 1s
- name: PLAN_EXECUTION_TIMEOUT
  value: 60s
