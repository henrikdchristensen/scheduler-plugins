trace-dir: data/traces/nodes=32_prio=4_arrival=8s
result-dir: results/plugin/mode=periodic2s_blocking=1_defpreempt=1_nodes=32_prio=4_arrival=8s
kwokctl-config-file: data/configs-kwokctl/plugin-scheduler-defpreempt=1.yaml
override-kwokctl-envs:
