trace-dir: data/traces/nodes=16_prio=4_arrival=8s
result-dir: results/plugin/mode=stablequeue16s_blocking=1_defpreempt=1_nodes=16_prio=4_arrival=8s
kwokctl-config-file: data/configs-kwokctl/plugin-scheduler-defpreempt=1.yaml
