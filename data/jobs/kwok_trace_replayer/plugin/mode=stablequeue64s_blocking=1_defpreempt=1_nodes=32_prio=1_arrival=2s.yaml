trace-dir: data/traces/nodes=32_prio=1_arrival=2s
result-dir: results/plugin/mode=stablequeue64s_blocking=1_defpreempt=1_nodes=32_prio=1_arrival=2s
kwokctl-config-file: data/configs-kwokctl/plugin-scheduler-defpreempt=1.yaml
override-kwokctl-envs:
  - name: SOLVER_PYTHON_TIMEOUT
    value: "16s"
  - name: OPTIMIZE_MODE
    value: "stable_queue"
  - name: OPTIMIZE_BLOCKING_SOLVING
    value: "true"
  - name: OPTIMIZE_STABLE_QUEUE_DELAY
    value: "64s"
